name: Admin Bot Poll (Fast)

# =====================================================================
# FAST POLLING — runs every 1 minute during peak hours
# Processes admin commands (/addchannel, /test, /start spot_, /spot)
# AND personalization requests (user sends username -> gets card)
#
# Why separate from scan workflow?
# - Personalization needs FAST response (user is waiting in DM)
# - Scan can run every 10 min (whales don't move every minute)
# - This keeps admin response time under 1 minute during peak
#
# Scheduling:
# - Peak (06:00-22:00 UTC): every 1 min
# - Off-peak (22:00-06:00 UTC): every 5 min (less traffic)
# - Total: ~1100 runs/month (very lightweight, <30s each)
# =====================================================================

on:
  schedule:
    # Peak hours: every minute (06:00-21:59 UTC) — 960 runs/day
    - cron: '* 6-21 * * *'
    # Off-peak: every 5 min (22:00-05:59 UTC) — 96 runs/day
    - cron: '*/5 22-23,0-5 * * *'
  workflow_dispatch:

concurrency:
  group: whale-bot-admin-poll
  cancel-in-progress: false

jobs:
  admin_poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: cache
          key: whale-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            whale-cache-${{ runner.os }}-

      - name: Run admin poll (commands + personalization)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPER_ADMIN_IDS: ${{ secrets.SUPER_ADMIN_IDS }}
        run: |
          python -m src.admin_bot 2>&1 | tee admin_logs.txt

      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: whale-cache-${{ runner.os }}-${{ github.sha }}
