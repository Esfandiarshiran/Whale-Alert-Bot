name: Whale Alert Bot

# =====================================================================
# SINGLE WORKFLOW — does both scan + admin poll
# Runs every 2 minutes during peak, every 10 min off-peak
# =====================================================================
# Why 2 min instead of 1 min?
# - GitHub Actions free tier has limits on workflow runs
# - 2 min is fast enough for admin commands (user waits max 2 min)
# - Single workflow avoids cache conflicts between two workflows
# =====================================================================

on:
  schedule:
    # Peak hours: every 2 min (06:00-21:58 UTC)
    - cron: '*/2 6-21 * * *'
    # Off-peak: every 10 min (22:00-05:50 UTC)
    - cron: '*/10 22-23,0-5 * * *'
  workflow_dispatch:

concurrency:
  group: whale-bot-run
  cancel-in-progress: false

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: cache
          key: whale-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            whale-cache-${{ runner.os }}-

      - name: Run admin poll (commands: /help, /test, /addchannel)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPER_ADMIN_IDS: ${{ secrets.SUPER_ADMIN_IDS }}
        run: |
          python -m src.admin_bot 2>&1 | tee admin_logs.txt || true

      - name: Run whale scan + send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPER_ADMIN_IDS: ${{ secrets.SUPER_ADMIN_IDS }}
        run: |
          python -m src.main 2>&1 | tee main_logs.txt

      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: whale-cache-${{ runner.os }}-${{ github.sha }}
