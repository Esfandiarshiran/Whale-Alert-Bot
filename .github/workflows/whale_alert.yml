name: Whale Alert Scan

# =====================================================================
# SCAN-ONLY WORKFLOW — fetches whale txs and posts alerts
# Runs every 10 min during peak, every 30 min off-peak
# Admin commands handled by separate admin_poll.yml (every 1 min)
# =====================================================================

on:
  schedule:
    # Peak hours: every 10 min (06:00-21:50 UTC)
    - cron: '*/10 6-21 * * *'
    # Off-peak: every 30 min (22:00-05:50 UTC)
    - cron: '*/30 22-23,0-5 * * *'
  workflow_dispatch:

concurrency:
  group: whale-bot-scan
  cancel-in-progress: false

jobs:
  whale_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: cache
          key: whale-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            whale-cache-${{ runner.os }}-

      - name: Run whale scan + send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPER_ADMIN_IDS: ${{ secrets.SUPER_ADMIN_IDS }}
        run: |
          python -m src.main 2>&1 | tee main_logs.txt

      - name: Save dedup cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: whale-cache-${{ runner.os }}-${{ github.sha }}
